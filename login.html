<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
</head>
<body>
  <main>
    <h1>ログイン</h1>

    <form id="login-form">
      <p>
        <label for="username">ユーザー名</label><br>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        >
      </p>

      <p>
        <label for="password">パスワード</label><br>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </p>

      <button id="login-button" type="submit">ログイン</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script>
    const API_BASE_URL =
      "https://magicstart-apie.yu2005yu-h-072.workers.dev";

    const form = document.querySelector("#login-form");
    const button = document.querySelector("#login-button");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "ログインしています…";

      const username = document.querySelector("#username").value.trim();
      const password = document.querySelector("#password").value;

      try {
        const response = await fetch(`${API_BASE_URL}/api/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ username, password }),
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "ログインできませんでした");
        }

        // 同じタブ内でマイページに移動しても使えるように保存
        sessionStorage.setItem("magicstart_session_token", result.token);
        sessionStorage.setItem(
          "magicstart_username",
          result.user.username,
        );

        message.textContent =
          `ログインしました（${result.user.username}）。`;
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
