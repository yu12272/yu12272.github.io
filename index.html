
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マイページ一覧</title>

    <!-- CSSファイルを読み込む -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>マイページ一覧</h1>
        <p>公開しているページを選択してください</p>
    </header>

    <main>
        <!-- リンク一覧を自動生成 -->
        <div id="page-list" class="page-list"></div>
    </main>

    <script>

        // ====================================
        // ページ一覧
        // 新しいページはここに追加
        // ====================================

        const pages = [

            {
                name: "チンチロゲーム",
                file: "chinchiro.html",
            },

            {
                name: "キャラクターシート",
                file: "character-sheet.html",
            }

        ];

        // ====================================
        // リンクを自動生成
        // ====================================

        const pageList = document.getElementById("page-list");

        pages.forEach(page => {

            const link = document.createElement("a");

            link.href = page.file;
            link.className = "page-link";
            link.textContent = `${page.icon} ${page.name}`;

            pageList.appendChild(link);

        });

    </script>

</body>

</html>
