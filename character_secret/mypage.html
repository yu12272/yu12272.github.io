<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイキャラクター | Magic Start!!</title><link rel="stylesheet" href="css/base.css"><style>.account{width:min(900px,calc(100% - 28px));margin:28px auto}.box{background:#fff;border:1px solid #ded4c8;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 14px 34px #3426181c}.actions,.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.item{justify-content:space-between;padding:12px 0;border-bottom:1px solid #ded4c8}.name{font-weight:bold}#message{min-height:1.5em}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f4ef;padding:12px}</style></head>
<body><main class="account"><section class="box"><h1>マイキャラクター</h1><p id="user"></p><div class="actions"><button id="new" type="button">新規キャラクター作成</button><button id="reload" class="secondary" type="button">一覧更新</button><button id="logout" class="secondary" type="button">ログアウト</button><a href="character-sheet.html">キャラシ画面へ</a></div><p id="message" role="status"></p></section>
<section class="box"><h2>キャラクター一覧</h2><ul id="list"></ul></section><section class="box" id="detail" hidden><h2 id="detailName"></h2><p id="meta"></p><pre id="data"></pre><a id="edit" href="character-sheet.html">キャラシで開く</a> <button id="close" class="secondary" type="button">閉じる</button></section></main>
<script>
const API="https://magicstart-apie.yu2005yu-h-072.workers.dev",token=sessionStorage.getItem("magicstart_session_token");
const msg=document.getElementById("message"),list=document.getElementById("list"),detail=document.getElementById("detail");
if(!token)location.replace("login.html");
document.getElementById("user").textContent=sessionStorage.getItem("magicstart_username")||"";
async function call(path,options={}){const headers=Object.assign({Authorization:"Bearer "+token},options.body?{"Content-Type":"application/json"}:{},options.headers||{});const r=await fetch(API+path,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"通信エラー "+r.status);return d;}
function failed(e){msg.textContent=e.message;if(e.message==="ログインが必要です"){sessionStorage.removeItem("magicstart_session_token");sessionStorage.removeItem("magicstart_username");location.replace("login.html");}}
async function refresh(){list.replaceChildren();msg.textContent="読み込み中…";try{const d=await call("/api/characters"),items=d.characters||[];if(!items.length){msg.textContent="キャラクターはまだありません。";return;}msg.textContent="";for(const c of items){const li=document.createElement("li");li.className="item";const n=document.createElement("span");n.className="name";n.textContent=c.character_name||"名前なし";const a=document.createElement("span");a.className="actions";const v=document.createElement("button");v.type="button";v.className="secondary";v.textContent="詳細";v.onclick=()=>show(c.character_id);const edit=document.createElement("a");edit.href="character-sheet.html?characterId="+encodeURIComponent(c.character_id);edit.textContent="編集";const del=document.createElement("button");del.type="button";del.className="secondary";del.textContent="削除";del.onclick=()=>remove(c);a.append(v,edit,del);li.append(n,a);list.append(li);}}catch(e){failed(e);}}
async function show(id){try{const d=await call("/api/characters/"+encodeURIComponent(id)),c=d.character;document.getElementById("detailName").textContent=c.characterName||"名前なし";document.getElementById("meta").textContent="ID: "+c.characterId+" / 作成: "+c.createdAt+" / 更新: "+c.updatedAt;document.getElementById("data").textContent=JSON.stringify(c.characterData,null,2);document.getElementById("edit").href="character-sheet.html?characterId="+encodeURIComponent(c.characterId);detail.hidden=false;detail.scrollIntoView({behavior:"smooth"});msg.textContent="";}catch(e){failed(e);}}
async function create(){const name=prompt("キャラクター名を入力してください。");if(name===null)return;if(!name.trim()){msg.textContent="名前を入力してください。";return;}try{const d=await call("/api/characters",{method:"POST",body:JSON.stringify({characterName:name.trim(),characterData:{}})});location.href="character-sheet.html?characterId="+encodeURIComponent(d.character.characterId);}catch(e){failed(e);}}
async function remove(c){if(!confirm("「"+(c.character_name||"名前なし")+"」を削除しますか？"))return;try{await call("/api/characters/"+encodeURIComponent(c.character_id),{method:"DELETE"});detail.hidden=true;msg.textContent="削除しました。";await refresh();}catch(e){failed(e);}}
document.getElementById("new").onclick=create;document.getElementById("reload").onclick=refresh;document.getElementById("close").onclick=()=>detail.hidden=true;
document.getElementById("logout").onclick=async()=>{try{await call("/api/logout",{method:"POST"});}catch{}sessionStorage.removeItem("magicstart_session_token");sessionStorage.removeItem("magicstart_username");location.replace("login.html");};
if(token)refresh();
</script></body></html>
