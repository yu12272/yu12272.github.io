<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイキャラクター | Magic Start!!</title><link rel="stylesheet" href="css/base.css"><style>.account{width:min(900px,calc(100% - 28px));margin:28px auto}.box{background:#fff;border:1px solid #ded4c8;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 14px 34px #3426181c}.actions,.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.item{justify-content:space-between;padding:12px 0;border-bottom:1px solid #ded4c8}.character-info{display:flex;align-items:center;gap:12px;min-width:0}.name{font-weight:bold}.portrait,.portrait-placeholder{width:72px;height:96px;flex:none;border-radius:8px}.portrait{object-fit:contain;background:#f6f4ef}.portrait-placeholder{display:grid;place-items:center;background:#f6f4ef;color:#756b60;font-size:.8rem;text-align:center}.portrait-placeholder[hidden],.portrait[hidden]{display:none}.actions a.secondary{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;padding:10px 16px;margin:6px;border:1px solid #cdbcff;border-radius:999px;background:#fff;color:var(--dark);font:inherit;font-weight:700;text-decoration:none;box-shadow:none}#message{min-height:1.5em}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f4ef;padding:12px}</style></head>
<body><main class="account"><section class="box"><h1>マイキャラクター</h1><p id="user"></p><div class="actions"><button id="new" type="button">新規キャラクター作成</button><button id="reload" class="secondary" type="button">一覧更新</button><button id="logout" class="secondary" type="button">ログアウト</button><a href="character-sheet.html">キャラシ画面へ</a></div><p id="message" role="status"></p></section>
<section class="box"><h2>キャラクター一覧</h2><ul id="list"></ul></section></main>
<script>
const API="https://magicstart-apie.yu2005yu-h-072.workers.dev",token=sessionStorage.getItem("magicstart_session_token");
const msg=document.getElementById("message"),list=document.getElementById("list");
if(!token)location.replace("login.html");
document.getElementById("user").textContent=sessionStorage.getItem("magicstart_username")||"";
async function call(path,options={}){const headers=Object.assign({Authorization:"Bearer "+token},options.body?{"Content-Type":"application/json"}:{},options.headers||{});const r=await fetch(API+path,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"通信エラー "+r.status);return d;}
function failed(e){msg.textContent=e.message;if(e.message==="ログインが必要です"){sessionStorage.removeItem("magicstart_session_token");sessionStorage.removeItem("magicstart_username");location.replace("login.html");}}
async function refresh(){list.replaceChildren();msg.textContent="読み込み中…";try{const d=await call("/api/characters"),items=d.characters||[];if(!items.length){msg.textContent="キャラクターはまだありません。";return;}msg.textContent="";for(const c of items){const li=document.createElement("li");li.className="item";const info=document.createElement("div");info.className="character-info";const placeholder=document.createElement("span");placeholder.className="portrait-placeholder";placeholder.textContent="立ち絵なし";const portrait=document.createElement("img");portrait.className="portrait";portrait.alt=(c.character_name||"キャラクター")+"の立ち絵";portrait.loading="lazy";portrait.hidden=true;info.append(placeholder,portrait);const n=document.createElement("span");n.className="name";n.textContent=c.character_name||"名前なし";info.append(n);call("/api/characters/"+encodeURIComponent(c.character_id)).then(result=>{const image=result.character?.characterData?.portraitData;if(typeof image==="string"&&image.startsWith("data:image/")){portrait.onload=()=>placeholder.remove();portrait.onerror=()=>{portrait.hidden=true;};portrait.src=image;portrait.hidden=false;}}).catch(()=>{});const a=document.createElement("span");a.className="actions";const edit=document.createElement("a");edit.className="secondary";edit.href="character-sheet.html?characterId="+encodeURIComponent(c.character_id);edit.textContent="編集";const del=document.createElement("button");del.type="button";del.className="secondary";del.textContent="削除";del.onclick=()=>remove(c);a.append(edit,del);li.append(info,a);list.append(li);}}catch(e){failed(e);}}
async function create(){const name=prompt("キャラクター名を入力してください。");if(name===null)return;if(!name.trim()){msg.textContent="名前を入力してください。";return;}try{const d=await call("/api/characters",{method:"POST",body:JSON.stringify({characterName:name.trim(),characterData:{}})});location.href="character-sheet.html?characterId="+encodeURIComponent(d.character.characterId);}catch(e){failed(e);}}
async function remove(c){if(!confirm("「"+(c.character_name||"名前なし")+"」を削除しますか？"))return;try{await call("/api/characters/"+encodeURIComponent(c.character_id),{method:"DELETE"});msg.textContent="削除しました。";await refresh();}catch(e){failed(e);}}
document.getElementById("new").onclick=create;document.getElementById("reload").onclick=refresh;
document.getElementById("logout").onclick=async()=>{try{await call("/api/logout",{method:"POST"});}catch{}sessionStorage.removeItem("magicstart_session_token");sessionStorage.removeItem("magicstart_username");location.replace("login.html");};
if(token)refresh();
</script></body></html>
