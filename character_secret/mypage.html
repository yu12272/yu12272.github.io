<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>マイキャラクター | Magic Start!!</title>
  <link rel="stylesheet" href="css/base.css">

  <link rel="icon" href="image/icon.png">

  <style>
    .account{width:min(900px,calc(100% - 28px));margin:28px auto}
    .box{background:#fff;border:1px solid #ded4c8;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 14px 34px #3426181c}
    .actions,.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
    .item{justify-content:space-between;padding:12px 0;border-bottom:1px solid #ded4c8}
    .character-info{display:flex;align-items:center;gap:12px;min-width:0}
    .name{font-weight:bold}
    .portrait,.portrait-placeholder{width:72px;height:96px;flex:none;border-radius:8px}
    .portrait{object-fit:contain;background:#f6f4ef}
    .portrait-placeholder{display:grid;place-items:center;background:#f6f4ef;color:#756b60;font-size:.8rem;text-align:center}
    .portrait-placeholder[hidden],.portrait[hidden]{display:none}
    .actions a.secondary{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;padding:10px 16px;margin:6px;border:1px solid #cdbcff;border-radius:999px;background:#fff;color:var(--dark);font:inherit;font-weight:700;text-decoration:none;box-shadow:none}
    .item-actions{justify-content:flex-end}
    .list-toolbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
    .list-toolbar select{padding:8px 10px;border:1px solid #c9c1b8;border-radius:8px;background:#fff;font:inherit}
    #message{min-height:1.5em}
  </style>
</head>
<body>
  <main class="account">
    <section class="box">
      <h1>マイキャラクター</h1>
      <p id="user"></p>
      <div class="actions">
        <button id="new" type="button">新規キャラクター作成</button>
        <button id="reload" class="secondary" type="button">一覧更新</button>
        <button id="logout" class="secondary" type="button">ログアウト</button>
        <a href="character-sheet.html">キャラシ画面へ</a>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section class="box">
      <h2>キャラクター一覧</h2>
      <div class="list-toolbar">
        <label for="sortOrder">並び替え</label>
        <select id="sortOrder">
          <option value="updated-desc">更新が新しい順</option>
          <option value="updated-asc">更新が古い順</option>
          <option value="created-desc">作成が新しい順</option>
          <option value="created-asc">作成が古い順</option>
          <option value="name-asc">名前順（あ→ん）</option>
          <option value="name-desc">名前順（ん→あ）</option>
        </select>
      </div>
      <ul id="list"></ul>
    </section>
  </main>

  <script>
    const API = "https://magicstart-apie.yu2005yu-h-072.workers.dev";
    const token = sessionStorage.getItem("magicstart_session_token");
    const msg = document.getElementById("message");
    const list = document.getElementById("list");
    const sortOrder = document.getElementById("sortOrder");

    if (!token) location.replace("login.html");
    document.getElementById("user").textContent = sessionStorage.getItem("magicstart_username") || "";

    async function call(path, options = {}) {
      const headers = Object.assign(
        { Authorization: "Bearer " + token },
        options.body ? { "Content-Type": "application/json" } : {},
        options.headers || {}
      );
      const response = await fetch(API + path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw Error(data.error || "通信エラー " + response.status);
      return data;
    }

    function failed(error) {
      msg.textContent = error.message;
      if (error.message === "ログインが必要です") {
        sessionStorage.removeItem("magicstart_session_token");
        sessionStorage.removeItem("magicstart_username");
        location.replace("login.html");
      }
    }

    function sheetUrl(character, parameters = {}) {
      const url = new URL("character-sheet.html", location.href);
      url.searchParams.set("characterId", character.character_id);
      for (const [key, value] of Object.entries(parameters)) {
        url.searchParams.set(key, value);
      }
      return url.href;
    }

    async function shareCharacter(character) {
      const url = new URL("character-sheet.html", location.href);
      url.searchParams.set("shareId", character.character_id);
      const shareUrl = url.href;
      try {
        await navigator.clipboard.writeText(shareUrl);
        msg.textContent = "「" + (character.character_name || "名前なし") + "」の共有URLをコピーしました。";
      } catch {
        prompt("共有URLをコピーしてください。", shareUrl);
      }
    }

    function actionLink(label, href, newTab = false) {
      const link = document.createElement("a");
      link.className = "secondary";
      link.href = href;
      link.textContent = label;
      if (newTab) {
        link.target = "_blank";
        link.rel = "noopener";
      }
      return link;
    }

    function sortList() {
      const items = [...list.children];
      const mode = sortOrder.value;

      items.sort((a, b) => {
        if (mode === "name-asc" || mode === "name-desc") {
          const order = a.dataset.name.localeCompare(b.dataset.name, "ja");
          return mode === "name-asc" ? order : -order;
        }

        const field = mode.startsWith("created-") ? "createdAt" : "updatedAt";
        const aTime = Date.parse(a.dataset[field]) || 0;
        const bTime = Date.parse(b.dataset[field]) || 0;
        return mode.endsWith("-asc") ? aTime - bTime : bTime - aTime;
      });

      list.append(...items);
    }
    function buildCocofoliaCharacter(characterData) {
      const data = characterData || {};
      const number = key => Number(data[key] || 0);
      const modifiers = data.skillModifiers || {};
      const labels = {
        str: "筋力", acc: "正確性", agi: "俊敏性", know: "知識",
        think: "思考力", looks: "容姿", luck: "幸運", emotion: "感情値"
      };
      const values = {
        str: number("str"), acc: number("acc"), agi: number("agi"),
        know: number("know"), think: number("think"), looks: number("looks"),
        luck: number("luck"), emotion: number("emotion"), mp: number("mp"), hp: number("hp")
      };
      values.combat = {
        拳: values.acc + 60 + Number(modifiers.combat?.拳 || 0),
        蹴り: values.acc + 30 + Number(modifiers.combat?.蹴り || 0),
        回避: Math.min(values.acc + values.agi, 90) + Number(modifiers.combat?.回避 || 0),
        カウンター: values.acc + Number(modifiers.combat?.カウンター || 0),
        弾き: values.acc + Number(modifiers.combat?.弾き || 0)
      };
      values.search = {
        観察: values.acc + 40 + Number(modifiers.search?.観察 || 0),
        分析: values.think + 30 + Number(modifiers.search?.分析 || 0),
        幸運: values.luck + Number(modifiers.search?.幸運 || 0),
        知識: values.know * 3 + Number(modifiers.search?.知識 || 0),
        五感: values.acc * 3 + Number(modifiers.search?.五感 || 0),
        追跡: values.agi + values.acc + values.luck + Number(modifiers.search?.追跡 || 0)
      };

      const command = data.cocDiceCommand || "CCB";
      const withModifier = (category, skill) => {
        const value = Number(modifiers[category]?.[skill] || 0);
        return value === 0 ? "" : value > 0 ? `+${value}` : String(value);
      };
      const lines = [
        "// ステータス判定",
        ...[["筋力", values.str], ["正確性", values.acc], ["俊敏性", values.agi], ["知識", values.know], ["思考力", values.think], ["容姿", values.looks], ["幸運", values.luck], ["感情値", values.emotion]].map(([name]) => `${command}<={${name}} 【${name}】`),
        "// 通常戦闘技能",
        `${command}<={正確性}+60${withModifier("combat", "拳")} 【拳】`,
        `${command}<={正確性}+30${withModifier("combat", "蹴り")} 【蹴り】`,
        `${command}<=min({正確性}+{俊敏性},90)${withModifier("combat", "回避")} 【回避】`,
        `${command}<={正確性}${withModifier("combat", "カウンター")} 【カウンター】`,
        `${command}<={正確性}${withModifier("combat", "弾き")} 【弾き】`,
        "// 探索技能",
        `${command}<={正確性}+40${withModifier("search", "観察")} 【観察】`,
        `${command}<={思考力}+30${withModifier("search", "分析")} 【分析】`,
        `${command}<={幸運}${withModifier("search", "幸運")} 【幸運】`,
        `${command}<={知識}*3${withModifier("search", "知識")} 【知識】`,
        `${command}<={正確性}*3${withModifier("search", "五感")} 【五感】`,
        `${command}<={俊敏性}+{正確性}+{幸運}${withModifier("search", "追跡")} 【追跡】`
      ];

      const specialSkills = [
        ["sp_disguise", `${command}<=${number("sp_disguise")} 【変装】`],
        ["sp_voice", `${command}<=${number("sp_voice")}+{正確性} 【変声】`],
        ["sp_negotiate", `${command}<=${number("sp_negotiate")} 【交渉】`],
        ["sp_authority", `${command}<=${number("sp_authority")} 【権威】`],
        ["sp_charm", `${command}<=${number("sp_charm")}+{容姿} 【魅了】`],
        ["sp_psychology", `${command}<=${number("sp_psychology")}+{思考力} 【心理学】`],
        ["sp_steal", `${command}<=${number("sp_steal")}+{正確性} 【盗み】`],
        ["sp_shooting", `${command}<=${number("sp_shooting")} 【射撃】`],
        ["sp_jump", `${command}<=${number("sp_jump")}+{筋力} 【跳躍】`]
      ].filter(([key]) => number(key) > 0).map(([, line]) => line);

      for (const skill of data.customSpecialSkills || []) {
        const allocation = Number(skill.allocation || 0);
        const name = String(skill.name || "").trim();
        if (allocation > 0 && name) {
          const base = skill.base && skill.base !== "none" ? `+{${labels[skill.base] || "なし"}}` : "";
          specialSkills.push(`${command}<=${allocation}${base} 【${name}】`);
        }
      }
      if (specialSkills.length) lines.push("// 特殊技能", ...specialSkills);

      const referenceExpression = (reference, multiplier, addition) => {
        const base = !reference || reference === "none" ? "0" : `{${labels[reference] || "なし"}}`;
        const mult = Number(multiplier ?? 1);
        const add = Number(addition || 0);
        let expression = mult === 1 ? base : `(${base})*${mult}`;
        if (add !== 0) expression += add > 0 ? `+${add}` : String(add);
        return expression;
      };
      const techniques = (data.techniques || []).filter(item => item.name || item.damage || item.note || Number(item.add));
      if (techniques.length) lines.push("// 技");
      for (const technique of techniques) {
        const name = technique.name || "名称未設定";
        lines.push(`${command}<=${referenceExpression(technique.ref, technique.mult, technique.add)} 【${name}】`);
        if (technique.mp !== "") lines.push(`:MP-${technique.mp} 【消費MP:${name}】`);
        if (technique.maintainMp !== "") lines.push(`:MP-${technique.maintainMp} 【維持MP:${name}】`);
        if (technique.damage) lines.push(`${technique.damage} 【${name}・ダメージ】`);
      }

      const weapons = (data.weapons || []).filter(item => item.name || item.damage || item.note || Number(item.add));
      if (weapons.length) lines.push("// 武器");
      for (const weapon of weapons) {
        const name = weapon.name || "名称未設定";
        lines.push(`${command}<=${referenceExpression(weapon.ref, weapon.mult, weapon.add)} 【${name}】`);
        if (weapon.damage) lines.push(`${weapon.damage} 【${name}・ダメージ】`);
      }

      return {
        kind: "character",
        data: {
          name: data.charName || "ダイス振り男",
          initiative: values.agi,
          externalUrl: null,
          iconUrl: null,
          params: [
            ["筋力", values.str], ["正確性", values.acc], ["俊敏性", values.agi],
            ["知識", values.know], ["思考力", values.think], ["容姿", values.looks],
            ["幸運", values.luck], ["感情値", values.emotion], ["総魔力量", values.mp]
          ].map(([label, value]) => ({ label, value: String(value) })),
          status: [
            { label: "HP", value: values.hp, max: values.hp },
            { label: "MP", value: values.mp, max: values.mp },
            { label: "感情値", value: values.emotion, max: 100 }
          ],
          commands: lines.join("\n"),
          memo: [data.characterMemo].join("\n")
        }
      };
    }

    async function copyCocofoliaCharacter(character) {
      msg.textContent = "ココフォリア駒データを取得中…";
      try {
        const result = await call("/api/characters/" + encodeURIComponent(character.character_id));
        const text = JSON.stringify(buildCocofoliaCharacter(result.character?.characterData || {}));
        try {
          await navigator.clipboard.writeText(text);
          msg.textContent = "「" + (character.character_name || "名前なし") + "」のココフォリア駒データをコピーしました。";
        } catch {
          prompt("クリップボードにコピーできませんでした。下の内容をコピーしてください。", text);
        }
      } catch (error) {
        failed(error);
      }
    }

    async function refresh() {
      list.replaceChildren();
      msg.textContent = "読み込み中…";
      try {
        const data = await call("/api/characters");
        const characters = data.characters || [];
        if (!characters.length) {
          msg.textContent = "キャラクターはまだありません。";
          return;
        }
        msg.textContent = "";

        for (const character of characters) {
          const item = document.createElement("li");
          item.className = "item";
          item.dataset.name = character.character_name || "名前なし";
          item.dataset.createdAt = character.created_at || "";
          item.dataset.updatedAt = character.updated_at || "";

          const info = document.createElement("div");
          info.className = "character-info";
          const placeholder = document.createElement("span");
          placeholder.className = "portrait-placeholder";
          placeholder.textContent = "立ち絵なし";
          const portrait = document.createElement("img");
          portrait.className = "portrait";
          portrait.alt = (character.character_name || "キャラクター") + "の立ち絵";
          portrait.loading = "eager";
          portrait.hidden = true;
          const thumbnail = character.portrait_thumbnail;
          if (typeof thumbnail === "string" && thumbnail.startsWith("data:image/")) {
            portrait.onload = () => { portrait.hidden = false; placeholder.hidden = true; };
            portrait.onerror = () => { portrait.hidden = true; };
            portrait.src = thumbnail;
          } else if (character.has_portrait) {
            placeholder.textContent = "サムネイル未登録（編集後に保存してください）";
          }
          info.append(placeholder, portrait);

          const name = document.createElement("span");
          name.className = "name";
          name.textContent = character.character_name || "名前なし";
          info.append(name);

          const actions = document.createElement("span");
          actions.className = "actions item-actions";
          actions.append(
            actionLink("編集", sheetUrl(character)),
            actionLink("閲覧", sheetUrl(character, { view: "1" }))
          );

          const outputButton = document.createElement("button");
          outputButton.type = "button";
          outputButton.className = "secondary";
          outputButton.textContent = "駒出力";
          outputButton.onclick = () => copyCocofoliaCharacter(character);

          const share = document.createElement("button");
          share.type = "button";
          share.className = "secondary";
          share.textContent = "共有";
          share.onclick = () => shareCharacter(character);

          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.className = "secondary";
          removeButton.textContent = "削除";
          removeButton.onclick = () => removeCharacter(character);

          actions.append(outputButton, share, removeButton);
          item.append(info, actions);
          list.append(item);
        }
        sortList();
      } catch (error) {
        failed(error);
      }
    }

    async function createCharacter() {
      const name = prompt("キャラクター名を入力してください。");
      if (name === null) return;
      if (!name.trim()) {
        msg.textContent = "名前を入力してください。";
        return;
      }
      try {
        const data = await call("/api/characters", {
          method: "POST",
          body: JSON.stringify({ characterName: name.trim(), characterData: {} })
        });
        location.href = "character-sheet.html?characterId=" + encodeURIComponent(data.character.characterId);
      } catch (error) {
        failed(error);
      }
    }

    async function removeCharacter(character) {
      if (!confirm("「" + (character.character_name || "名前なし") + "」を削除しますか？")) return;
      try {
        await call("/api/characters/" + encodeURIComponent(character.character_id), { method: "DELETE" });
        msg.textContent = "削除しました。";
        await refresh();
      } catch (error) {
        failed(error);
      }
    }

    document.getElementById("new").onclick = createCharacter;
    document.getElementById("reload").onclick = refresh;
    sortOrder.addEventListener("change", sortList);
    document.getElementById("logout").onclick = async () => {
      try { await call("/api/logout", { method: "POST" }); } catch {}
      sessionStorage.removeItem("magicstart_session_token");
      sessionStorage.removeItem("magicstart_username");
      location.replace("login.html");
    };

    if (token) refresh();
  </script>
</body>
</html>
