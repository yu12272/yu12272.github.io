<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>ログイン | Magic Start!!</title>
        <link rel="stylesheet" href="css/base.css">

        <link rel="icon" href="image/icon.png">

        <style>
        .account{
            width:min(560px,calc(100% - 28px));
            margin:32px auto
        }.box{
            background:#fff;border:1px solid #ded4c8;
            border-radius:20px;
            padding:24px;
            box-shadow:0 14px 34px rgba(52,38,24,.11)
        }.field{
            display:grid;
            gap:6px;
            margin:16px 0
        }.field input{
            padding:11px;
            border:1px solid #c9c1b8;
            border-radius:8px;
            font:inherit;
            width:100%
        }#message{
            min-height:1.5em
        }
        </style>
    </head>
    <body>
        <main class="account">
            <section class="box">
                <h1>ログイン</h1>
                <p>管理者から案内されたユーザー名とパスワードを入力してください。</p>
                <form id="loginForm">
                    <label class="field">
                        ユーザー名
                        <input id="username" autocomplete="username" required maxlength="24">
                    </label>
                    <label class="field">
                        パスワード
                        <input id="password" type="password" autocomplete="current-password" required>
                    </label>
                    <button id="loginButton">
                        ログイン
                    </button>
                    <a href="character-sheet.html">キャラシへ戻る</a>
                </form>
                <p id="message" role="status"></p>
            </section>
        </main>
        <script>
        const API="https://magicstart-apie.yu2005yu-h-072.workers.dev";
        document.getElementById("loginForm").addEventListener("submit",async(e)=>{
            e.preventDefault();
            const b=document.getElementById("loginButton"),m=document.getElementById("message");b.disabled=true;m.textContent="ログインしています…";
            try{
                const r=await fetch(API+"/api/login",{
                    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
                        username:document.getElementById("username").value.trim(),password:document.getElementById("password").value
                    })
                });
                const d=await r.json().catch(()=>({}));
                if(!r.ok)throw new Error(d.error||"ログインできませんでした。");
                sessionStorage.setItem("magicstart_session_token",d.token);
                sessionStorage.setItem("magicstart_username",d.user.username);
                location.href="mypage.html";}
            catch(err){m.textContent=err.message;}finally{b.disabled=false;}
        });
        </script>
    </body>
</html>
